<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMS AI – उपस्थिति</title>
<style>
:root{--ink:#1f2a24;--paper:#f6f7f2;--card:#ffffff;--green:#1f6b4a;--saffron:#e08a1e;--red:#b3402e;--line:#d9ddd2;--muted:#66705f}
@media (prefers-color-scheme:dark){:root{--ink:#eef1e8;--paper:#151a16;--card:#1e251f;--green:#4fb084;--saffron:#f0a647;--red:#e0705c;--line:#33403a;--muted:#a3ad9b}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);line-height:1.5}
header{padding:16px 16px 8px}
h1{font-size:20px;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
nav{display:flex;gap:6px;padding:8px 16px;position:sticky;top:0;background:var(--paper);z-index:5}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px}
nav button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{padding:8px 16px 40px;max-width:560px;margin:0 auto}
section{display:none}
section.on{display:block}
label{display:block;font-size:14px;margin:12px 0 4px;color:var(--muted)}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{display:block;width:100%;padding:13px;margin-top:12px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:600}
.btn.alt{background:var(--saffron);color:#1f1a0e}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.cam{position:relative;margin-top:12px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px;min-height:44px}
.ok{border-color:var(--green);color:var(--green)}
.bad{border-color:var(--red);color:var(--red)}
ul{list-style:none;padding:0;margin:12px 0 0}
li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:15px}
li small{color:var(--muted)}
.p{color:var(--green);font-weight:600}
.a{color:var(--red)}
.del{border:0;background:none;color:var(--red);font:inherit;font-size:13px}
.sum{display:flex;gap:8px;margin-top:8px}
.sum div{flex:1;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;font-size:13px;color:var(--muted)}
.sum b{display:block;font-size:22px;color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>RMS AI – उपस्थिति मोड</h1>
  <p id="load">मॉडल लोड हो रहे हैं… पहली बार इंटरनेट चाहिए</p>
</header>
<nav>
  <button data-t="add" class="on">विद्यार्थी जोड़ें</button>
  <button data-t="live">उपस्थिति लें</button>
  <button data-t="list">सूची</button>
</nav>
<main>

<section id="add" class="on">
  <label>नाम</label><input id="name" placeholder="जैसे: आशीष">
  <div class="row">
    <div><label>कक्षा</label><input id="cls" placeholder="जैसे: 10-A"></div>
    <div><label>रोल नंबर</label><input id="roll" inputmode="numeric" placeholder="जैसे: 12"></div>
  </div>
  <div class="cam"><video id="v1" playsinline muted></video></div>
  <div class="status" id="s1">पहले नाम, कक्षा और रोल नंबर भरें, फिर कैमरा चालू करें।</div>
  <button class="btn ghost" id="cam1">कैमरा चालू करें</button>
  <button class="btn alt" id="shot" disabled>फ़ोटो लें (0/5)</button>
  <button class="btn" id="save" disabled>विद्यार्थी सेव करें</button>
</section>

<section id="live">
  <div class="cam"><video id="v2" playsinline muted></video></div>
  <div class="status" id="s2">कैमरा बंद है।</div>
  <button class="btn" id="cam2">उपस्थिति शुरू करें</button>
  <ul id="recent"></ul>
</section>

<section id="list">
  <div class="sum"><div><b id="cp">0</b>उपस्थित</div><div><b id="ca">0</b>अनुपस्थित</div><div><b id="ct">0</b>कुल</div></div>
  <ul id="roster"></ul>
  <button class="btn ghost" id="csv">आज की सूची CSV में निकालें</button>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const NEEDED = 5;          // photos per student
const MATCH_DIST = 0.5;    // lower = stricter
const $ = id => document.getElementById(id);
let ready = false, matcher = null, tmp = [], streams = {}, loopTimer = null;

/* ---------- storage ---------- */
function read(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const students = () => read("rms_students", {});
const attToday = () => read("rms_att_"+today(), {});

/* ---------- models ---------- */
(async () => {
  try{
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    ready = true; $("load").textContent = "तैयार है"; buildMatcher();
  }catch(e){ $("load").textContent = "मॉडल लोड नहीं हुए। इंटरनेट जाँचें और पेज दोबारा खोलें।"; }
})();

function buildMatcher(){
  const s = students(), labeled = [];
  for(const id in s){
    if(s[id].desc && s[id].desc.length)
      labeled.push(new faceapi.LabeledFaceDescriptors(id, s[id].desc.map(a => new Float32Array(a))));
  }
  matcher = labeled.length ? new faceapi.FaceMatcher(labeled, MATCH_DIST) : null;
}

/* ---------- camera ---------- */
async function startCam(video){
  stopCam();
  try{
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:{ideal:640}, height:{ideal:480}}, audio:false});
    video.srcObject = st; await video.play(); streams[video.id] = st; return true;
  }catch(e){ return false; }
}
function stopCam(){
  for(const k in streams){ streams[k].getTracks().forEach(t => t.stop()); }
  streams = {}; clearInterval(loopTimer); loopTimer = null;
}
const opts = () => new faceapi.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:0.5});

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  stopCam(); resetLive(); $("cam1").textContent = "कैमरा चालू करें"; $("shot").disabled = true;
  document.querySelectorAll("nav button,section").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.t).classList.add("on");
  if(b.dataset.t === "list") renderList();
});

/* ---------- add student ---------- */
function setS1(t, c){ const e = $("s1"); e.textContent = t; e.className = "status " + (c||""); }
$("cam1").onclick = async () => {
  if(!ready) return setS1("मॉडल अभी लोड हो रहे हैं, थोड़ा रुकें।", "bad");
  if(!$("name").value.trim() || !$("cls").value.trim() || !$("roll").value.trim()) return setS1("नाम, कक्षा और रोल नंबर तीनों भरें।", "bad");
  tmp = []; $("shot").textContent = "फ़ोटो लें (0/"+NEEDED+")"; $("save").disabled = true;
  if(await startCam($("v1"))){ $("shot").disabled = false; $("cam1").textContent = "कैमरा दोबारा चालू करें"; setS1("चेहरा फ़्रेम में रखें। हर फ़ोटो में थोड़ा अलग एंगल रखें: सीधा, थोड़ा बाएँ, थोड़ा दाएँ।"); }
  else setS1("कैमरा नहीं खुला। कैमरा की अनुमति दें।", "bad");
};
$("shot").onclick = async () => {
  $("shot").disabled = true;
  const r = await faceapi.detectSingleFace($("v1"), opts()).withFaceLandmarks().withFaceDescriptor();
  if(!r){ setS1("चेहरा नहीं दिखा। रोशनी में सीधे देखें और फिर कोशिश करें।", "bad"); $("shot").disabled = false; return; }
  tmp.push(Array.from(r.descriptor));
  $("shot").textContent = "फ़ोटो लें ("+tmp.length+"/"+NEEDED+")";
  if(tmp.length >= NEEDED){ setS1("पाँचों फ़ोटो हो गईं। अब सेव करें।", "ok"); $("save").disabled = false; }
  else { setS1("फ़ोटो "+tmp.length+" ली गई। अगली लें।", "ok"); $("shot").disabled = false; }
};
$("save").onclick = () => {
  const s = students(), id = $("cls").value.trim().toUpperCase() + "_" + $("roll").value.trim();
  s[id] = {name:$("name").value.trim(), cls:$("cls").value.trim(), roll:$("roll").value.trim(), desc:tmp};
  if(!write("rms_students", s)) return setS1("सेव नहीं हो सका। फ़ोन की स्टोरेज जाँचें।", "bad");
  buildMatcher(); stopCam(); tmp = [];
  setS1("सेव हो गया: "+s[id].name+" ("+s[id].cls+", रोल "+s[id].roll+")", "ok");
  ["name","cls","roll"].forEach(i => $(i).value = ""); $("save").disabled = true; $("shot").disabled = true;
  $("shot").textContent = "फ़ोटो लें (0/"+NEEDED+")"; $("cam1").textContent = "कैमरा चालू करें";
};

/* ---------- live attendance ---------- */
function setS2(t, c){ const e = $("s2"); e.textContent = t; e.className = "status " + (c||""); }
function resetLive(){ setS2("कैमरा बंद है."); $("cam2").textContent = "उपस्थिति शुरू करें"; }
function renderRecent(){
  const s = students(), a = attToday();
  const rows = Object.keys(a).sort((x,y) => a[y].localeCompare(a[x])).slice(0,8);
  $("recent").innerHTML = rows.map(id => "<li><span>"+esc(s[id]?s[id].name:id)+"</span><small>"+a[id]+"</small></li>").join("");
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let busy = false;
$("cam2").onclick = async () => {
  if(loopTimer){ stopCam(); resetLive(); return; }
  if(!ready) return setS2("मॉडल अभी लोड हो रहे हैं।", "bad");
  if(!matcher) return setS2("पहले कम से कम एक विद्यार्थी जोड़ें।", "bad");
  if(!(await startCam($("v2")))) return setS2("कैमरा नहीं खुला। अनुमति दें।", "bad");
  $("cam2").textContent = "रोकें"; setS2("देख रहा हूँ…"); renderRecent();
  loopTimer = setInterval(async () => {
    if(busy) return; busy = true;
    try{
      const all = await faceapi.detectAllFaces($("v2"), opts()).withFaceLandmarks().withFaceDescriptors();
      if(!all.length){ busy = false; return; }
      const s = students(), a = attToday(); let msg = [], changed = false, unknown = 0;
      for(const f of all){
        const m = matcher.findBestMatch(f.descriptor);
        if(m.label === "unknown"){ unknown++; continue; }
        const who = s[m.label] ? s[m.label].name : m.label;
        if(!a[m.label]){ a[m.label] = new Date().toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit",hour12:true}); changed = true; msg.push(who+" – उपस्थित दर्ज"); }
        else msg.push(who+" – पहले से दर्ज");
      }
      if(changed){ write("rms_att_"+today(), a); renderRecent(); }
      if(msg.length) setS2(msg.join(" | "), changed ? "ok" : "");
      else if(unknown) setS2("चेहरा पहचाना नहीं गया।", "bad");
    }catch(e){}
    busy = false;
  }, 700);
};

/* ---------- list ---------- */
function renderList(){
  const s = students(), a = attToday(), ids = Object.keys(s).sort((x,y) => (s[x].cls+s[x].roll.padStart(4,"0")).localeCompare(s[y].cls+s[y].roll.padStart(4,"0"), "hi", {numeric:true}));
  const p = ids.filter(i => a[i]).length;
  $("cp").textContent = p; $("ca").textContent = ids.length - p; $("ct").textContent = ids.length;
  $("roster").innerHTML = ids.length ? ids.map(i => "<li><span>"+esc(s[i].name)+"<br><small>"+esc(s[i].cls)+" · रोल "+esc(s[i].roll)+"</small></span><span>"+(a[i]?"<span class='p'>उपस्थित "+a[i]+"</span>":"<span class='a'>अनुपस्थित</span>")+"<br><button class='del' data-id='"+esc(i)+"'>हटाएँ</button></span></li>").join("") : "<li>अभी कोई विद्यार्थी नहीं जुड़ा है।</li>";
  document.querySelectorAll(".del").forEach(b => b.onclick = () => {
    if(!confirm("इस विद्यार्थी को हटाएँ?")) return;
    const st = students(); delete st[b.dataset.id]; write("rms_students", st); buildMatcher(); renderList();
  });
}
$("csv").onclick = () => {
  const s = students(), a = attToday(), q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const rows = [["नाम","कक्षा","रोल","स्थिति","समय"]].concat(Object.keys(s).map(i => [s[i].name,s[i].cls,s[i].roll,a[i]?"उपस्थित":"अनुपस्थित",a[i]||""]));
  const blob = new Blob(["\ufeff"+rows.map(r => r.map(q).join(",")).join("\n")], {type:"text/csv;charset=utf-8"});
  const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = "attendance_"+today()+".csv"; l.click();
};
</script>
</body>
</html>
